name: Build Desktop Apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
            artifact: brainal-windows
          - os: macos-latest
            shell: bash
            artifact: brainal-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # The electron binary fetched by npm's postinstall is only used to run
      # the app in dev; electron-builder downloads its own copy for packaging.
      # Skipping it removes an unnecessary, flaky 123 MB download per job.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: ${{ matrix.shell }}

      - name: Build Web Bundle
        run: npm run build:web

      - name: Package Desktop App
        id: package
        continue-on-error: true
        run: npm run build:electron

      - name: Package Desktop App (retry after pause)
        if: steps.package.outcome == 'failure'
        run: |
          sleep 120
          npm run build:electron

      - name: Upload Installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.dmg
            packages/bruno-electron/out/*.zip
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.dmg
            packages/bruno-electron/out/*.zip
